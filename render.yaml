services:
  - type: web
    name: devlens-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: STORAGE_MODE
        value: disk
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_PAT
        sync: false
